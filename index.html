<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>NFC Site · Networking Made Simple</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
/* =========================================================================
   LANDING / HOME  ·  dot.cards-style (light theme)
   First page users see. "Log In" -> login.html
   --------------------------------------------------------------------------
   IMAGES (place these files in this same folder):
     • logo.png   -> top brand logo   (falls back to the NFC mark if missing)
     • logo1.jpg  -> hero image
   ========================================================================= */

:root{
  --ink:#1b1b1f; --muted:#8a8f98; --teal:#36b3c4;
  --line:#e9eaed; --btn:#2e2e30; --radius:14px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; }
body{
  font-family:'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color:var(--ink); background:#fff;
  display:flex; flex-direction:column; align-items:center;
  min-height:100dvh;
  padding:22px 20px calc(18px + env(safe-area-inset-bottom));
}

/* ---------- top brand: logo.png + "NFC Site" ---------- */
.brand{ display:flex; align-items:center; gap:9px; margin-bottom:14px; }
.brand img.logo{ width:26px; height:26px; border-radius:7px; object-fit:cover; display:block; }
.brand svg.logo-fallback{ width:26px; height:26px; display:none; }   /* shown only if logo.png missing */
.brand .name{ font-weight:700; font-size:18px; letter-spacing:-.01em; }

/* ---------- centered content ---------- */
.wrap{ flex:1; width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }

/* hero image (logo1.jpg) */
.hero{ width:300px; max-width:80%; aspect-ratio:3/4; margin:6px 0 26px;
  display:flex; align-items:center; justify-content:center; }
.hero img{ width:100%; height:100%; object-fit:contain; display:block; }
.hero.noimg{ background:#f3f4f6; border:1px dashed #d6d9de; border-radius:18px; color:#aeb3bb; }
.hero.noimg::after{ content:"logo1.jpg"; font-size:13px; }

.title{ font-size:28px; font-weight:700; letter-spacing:-.01em; margin:0 0 10px; }
.sub{ font-size:14.5px; color:var(--muted); margin:0 0 30px; }
.sub a{ color:var(--teal); text-decoration:none; font-weight:500; }
.sub a:hover{ text-decoration:underline; }

/* single Log In button (the only CTA now) */
.login-btn{
  width:100%; height:56px; border:none; border-radius:14px; cursor:pointer;
  background:var(--btn); color:#fff; font-family:inherit; font-size:16px; font-weight:600;
  text-decoration:none; display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 20px rgba(46,46,48,.22); transition:.15s;
}
.login-btn:hover{ background:#1f1f21; }
.login-btn:active{ transform:translateY(1px); }

/* ---------- bottom nav ---------- */
.footer{
  width:100%; max-width:560px; margin-top:30px; padding-top:16px;
  border-top:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; gap:34px; flex-wrap:wrap;
}
.footer a{
  color:var(--muted); text-decoration:none; font-size:13.5px; font-weight:500; transition:.15s;
}
.footer a:hover{ color:var(--ink); }

@media (max-width:480px){
  .footer{ gap:20px; }
  .title{ font-size:24px; }
}
</style>
</head>

<body>

  <!-- ===== top brand: custom logo.png + "NFC Site" ===== -->
  <div class="brand">
    <img class="logo" src="logo.png" alt="NFC Site logo"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
    <!-- fallback NFC mark if logo.png is missing -->
    <svg class="logo-fallback" viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" rx="11" fill="#000"/>
      <path d="M24 8C15.2 8 9 14.6 9 22.6c0 5.8 3.4 10.8 8.4 13.2" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M24 40c8.8 0 15-6.6 15-14.6 0-5.8-3.4-10.8-8.4-13.2" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M18 31V18l12 14V17" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="name">NFC Site</span>
  </div>

  <!-- ===== centered content ===== -->
  <div class="wrap">

    <!-- hero image: custom logo1.jpg (falls back to a placeholder if missing) -->
    <div class="hero">
      <img src="logo1.jpg" alt="NFC"
           onerror="this.parentElement.classList.add('noimg'); this.remove();">
    </div>

    <h1 class="title">Networking Made Simple</h1>
    <p class="sub"><a href="login.html">Log in</a> to start networking</p>

    <!-- only the Log In button (Sign Up removed) -> goes to login page -->
    <a class="login-btn" href="login.html">Log In</a>
  </div>

  <!-- ===== bottom nav ===== -->
  <nav class="footer">
    <a href="https://t.me/NFC_UZB" target="_blank" rel="noopener">Telegram</a>
    <a href="https://www.instagram.com/nfc.card.uzb/" target="_blank" rel="noopener">Instagram</a>
    <a href="tel:+998987727127">Phone Number</a>
    <a href="https://t.me/nfc_card_uzb" target="_blank" rel="noopener">Shop</a>
  </nav>

</body>
</html>
