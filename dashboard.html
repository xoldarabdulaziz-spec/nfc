<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1b1e25" />
<title>My Sites · Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
/* =========================================================================
   DASHBOARD · "My Sites"  (dark theme, carrd-style)
   --------------------------------------------------------------------------
   • Reached after a successful login (login.html redirects here).
   • Marked/scribbled reference elements were intentionally omitted:
       – extra left-sidebar icons   -> only Logo + My Sites + Profile kept
       – per-card live preview image -> replaced with a clean brand header
   • Responsive: sidebar collapses to a top bar on mobile, cards reflow.
   • LOGO: search for "LOGO SLOT" below to drop in your own logo later.
   • SITES: edit the SITES array in the script to change cards/links.
   ========================================================================= */

:root{
  --bg:        #1b1e25;
  --sidebar:   #15171d;
  --card:      #23262e;
  --card-2:    #2a2e38;
  --line:      rgba(255,255,255,.08);
  --line-2:    rgba(255,255,255,.14);
  --text:      #eef1f6;
  --muted:     #8b93a1;
  --faint:     #626a78;
  --teal:      #2dd4bf;
  --teal-2:    #0fb5a6;
  --danger:    #f0556a;
  --radius:    14px;
  --shadow:    0 12px 30px rgba(0,0,0,.40);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; }
body{
  background:var(--bg); color:var(--text);
  font-family:'Plus Jakarta Sans', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing:antialiased;
}

.app{ display:flex; min-height:100dvh; }

/* =====================  LEFT SIDEBAR  ===================== */
.sidebar{
  width:72px; flex:0 0 72px;
  background:var(--sidebar); border-right:1px solid var(--line);
  display:flex; flex-direction:column; align-items:center;
  padding:16px 0; gap:18px; position:sticky; top:0; height:100dvh;
}

/* LOGO SLOT — replace the inner <svg> with <img src="logo.png" class="logo-img"> when you have your logo */
.logo{
  width:44px; height:44px; border-radius:13px;
  background:#000; display:grid; place-items:center;
  border:1px solid var(--line-2); overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,.5);
}
.logo svg, .logo .logo-img{ width:100%; height:100%; object-fit:cover; display:block; }

.side-nav{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
.side-item{
  width:46px; height:46px; border-radius:12px; cursor:pointer;
  display:grid; place-items:center; color:var(--muted);
  background:none; border:1px solid transparent; transition:.16s;
}
.side-item:hover{ background:rgba(255,255,255,.05); color:var(--text); }
.side-item.active{ background:rgba(45,212,191,.14); color:var(--teal); border-color:rgba(45,212,191,.3); }
.side-item svg{ width:22px; height:22px; }

.side-bottom{ margin-top:auto; position:relative; }
.avatar-btn{
  width:40px; height:40px; border-radius:50%; cursor:pointer; padding:0;
  border:2px solid var(--line-2); background:linear-gradient(135deg,#7c5cff,#ff5c8a);
  color:#fff; font-weight:700; font-size:15px; display:grid; place-items:center;
}
.avatar-btn:active{ transform:scale(.94); }

/* profile popover */
.popover{
  position:absolute; left:54px; bottom:0; width:210px;
  background:var(--card-2); border:1px solid var(--line-2); border-radius:14px;
  box-shadow:var(--shadow); padding:12px; display:none; z-index:40;
}
.popover.show{ display:block; }
.popover .pemail{ font-size:12.5px; color:var(--muted); word-break:break-all; margin-bottom:10px; }
.popover .logout{
  width:100%; padding:9px; border-radius:10px; cursor:pointer;
  background:rgba(240,85,106,.12); color:var(--danger); border:1px solid rgba(240,85,106,.3);
  font-family:inherit; font-weight:600; font-size:13px;
}

/* =====================  MAIN  ===================== */
.main{ flex:1; min-width:0; padding:26px 30px 40px; }

.topbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
.eyebrow{ font-size:11px; font-weight:700; letter-spacing:.16em; color:var(--faint); }
.head-left h1{ margin:4px 0 0; font-size:26px; font-weight:800; letter-spacing:-.02em; }

.head-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.pill{
  height:38px; padding:0 14px; border-radius:10px; cursor:pointer;
  background:var(--card); border:1px solid var(--line); color:var(--text);
  font-family:inherit; font-size:13.5px; font-weight:600;
  display:inline-flex; align-items:center; gap:8px; transition:.15s;
}
.pill:hover{ background:var(--card-2); border-color:var(--line-2); }
.pill .muted{ color:var(--muted); font-weight:500; }

.view-toggle{ display:flex; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:3px; }
.vt{ width:34px; height:32px; border-radius:8px; border:none; background:none; color:var(--faint); cursor:pointer; display:grid; place-items:center; transition:.15s; }
.vt:hover{ color:var(--text); }
.vt.active{ background:var(--card-2); color:var(--teal); }
.vt svg{ width:17px; height:17px; }

.new-site{
  height:38px; padding:0 16px; border-radius:10px; cursor:pointer; border:none;
  background:linear-gradient(135deg,var(--teal),var(--teal-2)); color:#07221f;
  font-family:inherit; font-size:13.5px; font-weight:700;
  display:inline-flex; align-items:center; gap:7px;
  box-shadow:0 8px 18px rgba(45,212,191,.25); transition:.15s;
}
.new-site:hover{ filter:brightness(1.06); }
.new-site:active{ transform:translateY(1px); }

/* =====================  SITES GRID  ===================== */
.sites{ display:grid; gap:18px; }
.sites.grid-lg{ grid-template-columns:repeat(auto-fill, minmax(330px,1fr)); }
.sites.grid-sm{ grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); }
.sites.list   { grid-template-columns:1fr; gap:12px; }

.card{
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.25); transition:.18s;
  display:flex; flex-direction:column;
}
.card:hover{ transform:translateY(-3px); border-color:var(--line-2); box-shadow:var(--shadow); }

/* brand header (replaces the removed preview image) */
.card-head{ height:120px; position:relative; display:grid; place-items:center; }
.card-head::after{ content:""; position:absolute; inset:0; background:radial-gradient(120px 80px at 80% 20%, rgba(255,255,255,.18), transparent 70%); }
.site-ava{
  width:54px; height:54px; border-radius:16px; display:grid; place-items:center;
  background:rgba(0,0,0,.28); backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,.25);
  color:#fff; font-weight:800; font-size:20px; z-index:1;
}
.site-ava svg{ width:34px; height:34px; }

.card-body{ padding:14px 16px 4px; }
.card-title{ font-size:16px; font-weight:700; letter-spacing:-.01em; }
.card-domain{ font-size:13px; color:var(--muted); margin-top:2px; }

.card-actions{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px 14px; margin-top:auto; }
.act-icons{ display:flex; gap:2px; }
.act{
  width:32px; height:32px; border-radius:9px; border:none; background:none; cursor:pointer;
  color:var(--faint); display:grid; place-items:center; transition:.14s;
}
.act:hover{ background:var(--card-2); color:var(--text); }
.act svg{ width:16px; height:16px; }
.view-btn{
  padding:8px 18px; border-radius:10px; text-decoration:none;
  background:var(--card-2); border:1px solid var(--line-2); color:var(--text);
  font-size:13px; font-weight:700; transition:.15s; white-space:nowrap;
}
.view-btn:hover{ background:var(--teal); color:#07221f; border-color:transparent; }

/* ---- list view ---- */
.sites.list .card{ flex-direction:row; align-items:center; }
.sites.list .card-head{ width:84px; height:84px; flex:0 0 84px; border-radius:14px; margin:10px; }
.sites.list .card-head::after{ border-radius:14px; }
.sites.list .site-ava{ width:42px; height:42px; border-radius:12px; font-size:16px; }
.sites.list .site-ava svg{ width:26px; height:26px; }
.sites.list .card-body{ flex:1; padding:10px 4px; }
.sites.list .card-actions{ padding:14px 16px; margin:0; }

/* =====================  TOAST  ===================== */
.toast{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(16px);
  background:#fff; color:#11151c; font-weight:700; font-size:13.5px;
  padding:11px 18px; border-radius:999px; box-shadow:var(--shadow);
  opacity:0; pointer-events:none; transition:.26s; z-index:60; white-space:nowrap;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* =====================  RESPONSIVE  ===================== */
@media (max-width:760px){
  .app{ flex-direction:column; }
  .sidebar{
    width:100%; height:auto; flex-direction:row; gap:12px; position:sticky; top:0;
    padding:10px 14px; border-right:none; border-bottom:1px solid var(--line); z-index:30;
  }
  .side-nav{ flex-direction:row; margin-top:0; }
  .side-bottom{ margin-top:0; margin-left:auto; }
  .popover{ left:auto; right:0; bottom:-8px; transform:translateY(100%); }
  .main{ padding:18px 16px 40px; }
  .head-left h1{ font-size:22px; }
  .head-right{ width:100%; }
  .head-right .pill.sort{ display:none; } /* keep the bar tidy on small screens */
}
@media (max-width:420px){
  .view-toggle{ display:none; }
}
</style>
</head>

<body>
  <div class="app">

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar">

      <!-- LOGO SLOT (top-left). Replace the <svg> with <img src="logo.png" class="logo-img"> later. -->
      <div class="logo" title="NFC">
        <svg viewBox="0 0 48 48" aria-label="NFC logo">
          <path d="M24 6C14.6 6 7 13.2 7 22.2c0 6.4 3.9 12 9.6 14.7" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/>
          <path d="M24 42c9.4 0 17-7.2 17-16.2 0-6.4-3.9-12-9.6-14.7" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/>
          <path d="M17.5 31V17l13 15V18" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- only the kept nav item: My Sites (the scribbled extras are intentionally removed) -->
      <nav class="side-nav">
        <button class="side-item active" title="My Sites" aria-label="My Sites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </button>
      </nav>

      <!-- profile (kept) -->
      <div class="side-bottom">
        <button class="avatar-btn" id="avatarBtn" aria-label="Profile" onclick="toggleMenu(event)">X</button>
        <div class="popover" id="popover">
          <div class="pemail" id="pemail">xoldar.abdulaziz@gmail.com</div>
          <button class="logout" onclick="logout()">Log out</button>
        </div>
      </div>
    </aside>

    <!-- ===================== MAIN ===================== -->
    <main class="main">

      <header class="topbar">
        <div class="head-left">
          <div class="eyebrow">DASHBOARD</div>
          <h1>My Sites</h1>
        </div>

        <div class="head-right">
          <button class="pill" onclick="toast('All Sites')">All Sites <span class="muted" id="siteCount">(0)</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <button class="pill sort" onclick="toast('Sorted by Newest')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4L3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg>
            <span class="muted">Newest</span>
          </button>

          <div class="view-toggle" role="tablist">
            <button class="vt active" data-view="grid-lg" title="Large grid" onclick="setView(this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/></svg>
            </button>
            <button class="vt" data-view="grid-sm" title="Small grid" onclick="setView(this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>
            </button>
            <button class="vt" data-view="list" title="List" onclick="setView(this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
          </div>

          <button class="new-site" onclick="toast('New Site — coming soon')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            New Site
          </button>
        </div>
      </header>

      <!-- cards are rendered by JS from the SITES array -->
      <section class="sites grid-lg" id="sites"></section>
    </main>
  </div>

  <div class="toast" id="toast">Done</div>

<script>
/* =========================================================================
   DATA — edit these cards freely (name, domain label, where "View" opens).
   • grad:  CSS gradient for the brand header
   • logo:  true -> show the NFC mark; otherwise the first letter is used
   ========================================================================= */
const SITES = [
  { name:"NFC Card",   domain:"yukitanaka.studio",     link:"index.html", grad:"linear-gradient(135deg,#7c5cff,#ff5c8a)", logo:true },
  { name:"AVA STORE",  domain:"avastore1.carrd.co",    link:"#",          grad:"linear-gradient(135deg,#3b82f6,#22d3ee)" },
  { name:"Studio Press",domain:"studiopress.carrd.co", link:"#",          grad:"linear-gradient(135deg,#f59e0b,#ef4444)" }
];

const USER_EMAIL = "xoldar.abdulaziz@gmail.com";

/* ---- simple auth guard: must be logged in (flag set by login.html) ---- */
if (localStorage.getItem('dot_logged_in') !== '1') {
  location.replace('login.html');
}

/* ---- reusable icons ---- */
const ICONS = {
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  swap:'<path d="M7 7h11l-3-3M17 17H6l3 3"/>',
  archive:'<rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/>',
  pin:'<path d="M12 17v5M9 3h6l-1 7 3 3H7l3-3-1-7z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.9 7.9 0 0 0 0-2l2-1.5-2-3.4-2.3 1a7.9 7.9 0 0 0-1.7-1l-.3-2.5h-4l-.3 2.5a7.9 7.9 0 0 0-1.7 1l-2.3-1-2 3.4L4.6 11a7.9 7.9 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7.9 7.9 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7.9 7.9 0 0 0 1.7-1l2.3 1 2-3.4z"/>'
};
const NFC_MARK = '<svg viewBox="0 0 48 48" fill="none"><path d="M24 6C14.6 6 7 13.2 7 22.2c0 6.4 3.9 12 9.6 14.7" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><path d="M24 42c9.4 0 17-7.2 17-16.2 0-6.4-3.9-12-9.6-14.7" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><path d="M17.5 31V17l13 15V18" stroke="#fff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function actBtn(kind,label){
  return `<button class="act" title="${label}" aria-label="${label}" onclick="toast('${label}')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[kind]}</svg></button>`;
}

/* ---- render cards ---- */
function render(){
  const wrap = document.getElementById('sites');
  wrap.innerHTML = SITES.map(s => {
    const ava = s.logo ? NFC_MARK : s.name.trim().charAt(0).toUpperCase();
    const target = s.link && s.link !== '#'
        ? `href="${s.link}"`
        : `href="#" onclick="toast('Opening ${s.name}…');return false;"`;
    return `
    <article class="card">
      <div class="card-head" style="background:${s.grad}">
        <div class="site-ava">${ava}</div>
      </div>
      <div class="card-body">
        <div class="card-title">${s.name}</div>
        <div class="card-domain">${s.domain}</div>
      </div>
      <div class="card-actions">
        <div class="act-icons">
          ${actBtn('edit','Edit')}${actBtn('copy','Duplicate')}${actBtn('swap','Transfer')}
          ${actBtn('archive','Archive')}${actBtn('pin','Pin')}${actBtn('gear','Settings')}
        </div>
        <a class="view-btn" ${target} ${s.link && s.link!=='#' ? 'target="_self"' : ''}>View</a>
      </div>
    </article>`;
  }).join('');
  document.getElementById('siteCount').textContent = `(${SITES.length})`;
}

/* ---- view switch (large grid / small grid / list) ---- */
function setView(btn){
  document.querySelectorAll('.vt').forEach(v=>v.classList.remove('active'));
  btn.classList.add('active');
  const sites = document.getElementById('sites');
  sites.classList.remove('grid-lg','grid-sm','list');
  sites.classList.add(btn.dataset.view);
}

/* ---- profile menu + logout ---- */
function toggleMenu(e){ e.stopPropagation(); document.getElementById('popover').classList.toggle('show'); }
document.addEventListener('click', ()=> document.getElementById('popover').classList.remove('show'));
function logout(){
  try{ localStorage.removeItem('dot_logged_in'); }catch(_){}
  location.href = 'login.html';
}

/* ---- toast ---- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ---- init ---- */
document.getElementById('pemail').textContent = USER_EMAIL;
document.getElementById('avatarBtn').textContent = (USER_EMAIL[0] || 'U').toUpperCase();
render();
</script>
</body>
</html>
