<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#151a23" />
<title>Setup · NFC Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
/* =========================================================================
   SETUP · NFC profile editor  (dot.cards-style, dark theme)
   Opened after "Create site". Single scrollable page; the top "Setup"
   header + back arrow are sticky. Everything persists in localStorage
   under "dot_profile" so each client's profile is saved.
   ========================================================================= */

:root{
  --bg:#151a23; --card:#1b212c; --card-2:#222936; --head:#171c26;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --text:#eef2f7; --muted:#8b94a3; --faint:#677183; --label:#7d8799;
  --purple:#7c6cff; --blue:#3b82f6; --green:#34c759; --danger:#f0556a;
  --radius:16px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; }
body{
  background:var(--bg); color:var(--text);
  font-family:'Plus Jakarta Sans', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing:antialiased;
}
img,svg{ display:block; }

/* centered phone-width column */
.app{ max-width:500px; margin:0 auto; min-height:100dvh; padding-bottom:40px; }

/* ===== sticky header ===== */
.topbar{
  position:sticky; top:0; z-index:50;
  height:58px; display:flex; align-items:center; justify-content:center;
  background:var(--head); border-bottom:1px solid var(--line);
  padding:0 16px;
}
.topbar .back{
  position:absolute; left:16px; width:40px; height:40px; border-radius:50%;
  display:grid; place-items:center; cursor:pointer;
  background:#2a3140; border:1px solid var(--line-2); color:var(--text); text-decoration:none;
}
.topbar .back:active{ transform:scale(.93); }
.topbar h1{ margin:0; font-size:19px; font-weight:800; letter-spacing:-.01em; }

.body{ padding:18px 18px 0; display:flex; flex-direction:column; gap:18px; }

/* ===== banner + avatar ===== */
.banner{
  position:relative; height:188px; border-radius:var(--radius);
  background:linear-gradient(160deg,#2b3340 0%, #232a36 45%, #1a1f29 100%);
  border:1px solid var(--line);
  margin-bottom:34px;            /* room for the avatar to hang below the banner */
}
.banner .banner-img{ position:absolute; inset:0; border-radius:var(--radius); background-size:cover; background-position:center; }
.banner .grad{ position:absolute; inset:0; border-radius:var(--radius); background:linear-gradient(160deg,#323a49,#171c26 75%); }
.avatar{
  position:absolute; left:22px; bottom:-38px; width:112px; height:112px; border-radius:50%; z-index:2;
  background:#9aa3b2 center/cover no-repeat; border:4px solid var(--card);
  display:grid; place-items:center; cursor:pointer; overflow:hidden;
  box-shadow:0 8px 22px rgba(0,0,0,.45);
}
.avatar .ph{ width:100%; height:100%; display:grid; place-items:center; color:#eef2f7;
  background:radial-gradient(circle at 50% 38%, #c4ccd6, #9aa3b2); }
.avatar .ph svg{ width:64px; height:64px; opacity:.92; }
.upload{
  position:absolute; right:14px; bottom:14px; z-index:2;
  display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:11px; cursor:pointer;
  background:#171c26; border:1px solid var(--line-2); color:var(--text); font-family:inherit; font-size:13.5px; font-weight:700;
}
.upload:active{ transform:scale(.96); }

/* ===== section label + edit row ===== */
.sec-row{ display:flex; align-items:center; justify-content:space-between; }
.sec-label{ font-size:12px; font-weight:800; letter-spacing:.12em; color:var(--label); text-transform:uppercase; }
.pillbtn{
  display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:10px; cursor:pointer;
  background:#2a3140; border:1px solid var(--line-2); color:var(--text); font-family:inherit; font-size:13px; font-weight:700;
}
.pillbtn:active{ transform:scale(.96); }
.pillbtn svg{ width:14px; height:14px; }

/* ===== generic card ===== */
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); }

/* bio fields */
.bio .row{ padding:14px 16px; border-bottom:1px solid var(--line); }
.bio .row:last-child{ border-bottom:none; }
.bio .k{ font-size:13.5px; font-weight:700; }
.bio .v{ font-size:13.5px; color:var(--muted); margin-top:5px; min-height:8px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:9px; }
.chip{ font-size:12.5px; font-weight:600; color:#cfd6e0; background:#39414f; border-radius:999px; padding:6px 12px; }

/* row card (icon + text + right) */
.rowcard{ display:flex; align-items:center; gap:13px; padding:14px 15px; }
.rowcard .ic{ width:38px; height:38px; flex:0 0 38px; border-radius:11px; display:grid; place-items:center; }
.rowcard .grow{ flex:1; min-width:0; }
.rowcard .t{ font-size:14.5px; font-weight:700; }
.rowcard .d{ font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.45; }
.rowcard .chev{ color:var(--faint); flex:0 0 auto; }

/* toggle switch */
.switch{ width:48px; height:28px; border-radius:999px; background:#3a4150; position:relative; cursor:pointer; flex:0 0 48px; transition:.2s; border:none; }
.switch.on{ background:var(--green); }
.switch::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.2s; }
.switch.on::after{ left:23px; }

/* content list */
.content-list{ display:flex; flex-direction:column; gap:11px; }
.citem{ display:flex; align-items:center; gap:11px; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:14px; }
.citem.drag{ opacity:.4; }
.citem .handle{ color:var(--faint); cursor:grab; flex:0 0 auto; touch-action:none; }
.citem .cic{ width:38px; height:38px; flex:0 0 38px; border-radius:50%; display:grid; place-items:center; overflow:hidden; }
.citem .grow{ flex:1; min-width:0; }
.citem .ct{ font-size:14.5px; font-weight:700; }
.citem .cs{ font-size:12.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.citem .edit{ width:32px; height:32px; border-radius:9px; border:none; background:none; color:var(--faint); cursor:pointer; display:grid; place-items:center; }
.citem .edit:hover{ background:var(--card-2); color:var(--text); }

.addbtn{
  width:100%; height:50px; border-radius:13px; cursor:pointer; border:none;
  background:#6b7480; color:#fff; font-family:inherit; font-size:14.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:8px; transition:.15s;
}
.addbtn:hover{ background:#7a838f; }
.addbtn:active{ transform:scale(.99); }

/* style card */
.stylecard{ padding:16px; }
.stylecard .hd{ display:flex; align-items:center; justify-content:space-between; }
.stylecard .hd .name{ font-size:15px; font-weight:700; }
.badge{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:var(--muted); background:#2a3140; border-radius:999px; padding:5px 11px; }
.badge .dot{ width:9px; height:9px; border-radius:50%; }

.swatches{ display:flex; gap:11px; margin:15px 0 16px; }
.swatch{ width:30px; height:30px; border-radius:50%; cursor:pointer; border:2px solid transparent; padding:0; }
.swatch.sel{ box-shadow:0 0 0 2px var(--card), 0 0 0 4px #fff; }

.upgrade{
  width:100%; padding:13px; border-radius:12px; cursor:pointer;
  background:#1e2531; border:1px solid var(--line-2); color:var(--text);
  font-family:inherit; font-size:13.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:9px;
}
.upgrade .spark{ color:var(--purple); }

.divline{ height:1px; background:var(--line); margin:16px 0; }
.style-h{ font-size:14px; font-weight:700; margin-bottom:11px; }

.themeseg{ display:flex; gap:11px; }
.themeseg button{
  flex:1; height:48px; border-radius:12px; cursor:pointer; font-family:inherit; font-size:13.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line-2);
}
.themeseg .bright{ background:#fff; color:#15181f; }
.themeseg .dim{ background:#222a36; color:#fff; }
.themeseg .dark{ background:#000; color:#fff; }
.radio{ width:16px; height:16px; border-radius:50%; border:2px solid currentColor; display:grid; place-items:center; opacity:.5; }
.themeseg button.sel .radio{ opacity:1; border-color:#19c37d; }
.themeseg button.sel .radio::after{ content:""; width:8px; height:8px; border-radius:50%; background:#19c37d; }

.iconstyles{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.istyle{ width:36px; height:36px; border-radius:50%; cursor:pointer; border:2px solid transparent; display:grid; place-items:center; overflow:hidden; padding:0; background:none; }
.istyle.sel{ box-shadow:0 0 0 2px var(--card), 0 0 0 4px #fff; }
.istyle.lock{ opacity:.4; cursor:default; }
.isep{ width:1px; height:26px; background:var(--line-2); }

/* preview button */
.preview{
  width:100%; height:54px; border-radius:14px; cursor:pointer; border:none; margin-top:6px;
  background:#3d4350; color:#fff; font-family:inherit; font-size:15.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:9px;
}
.preview:hover{ background:#474e5c; }
.preview:active{ transform:translateY(1px); }

/* ===== modals ===== */
.overlay{ position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center; padding:16px;
  background:rgba(6,9,14,.66); backdrop-filter:blur(3px); }
.overlay.show{ display:flex; }
.modal{ width:100%; max-width:440px; max-height:88dvh; overflow:auto; background:var(--card); border:1px solid var(--line-2);
  border-radius:18px; box-shadow:0 18px 50px rgba(0,0,0,.5); padding:20px; animation:pop .16s ease; }
@keyframes pop{ from{ transform:translateY(10px) scale(.98); opacity:0 } to{ transform:none; opacity:1 } }
.modal h3{ margin:0 0 4px; font-size:18px; font-weight:800; }
.modal .x{ float:right; width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:none; color:var(--muted); cursor:pointer; }
.mlabel{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin:14px 0 6px; }
.minput, .mselect{ width:100%; font-family:inherit; font-size:14.5px; color:var(--text); background:var(--bg);
  border:1px solid var(--line); border-radius:10px; padding:11px 12px; outline:none; }
.minput:focus,.mselect:focus{ border-color:var(--purple); box-shadow:0 0 0 3px rgba(124,108,255,.18); }
.mactions{ display:flex; justify-content:space-between; gap:10px; margin-top:20px; }
.btn-del{ padding:10px 14px; border-radius:10px; background:rgba(240,85,106,.12); border:1px solid rgba(240,85,106,.3); color:var(--danger); font-family:inherit; font-weight:700; cursor:pointer; }
.btn-row{ display:flex; gap:10px; margin-left:auto; }
.btn-ghost{ padding:10px 16px; border-radius:10px; background:none; border:1px solid var(--line-2); color:var(--text); font-family:inherit; font-weight:600; cursor:pointer; }
.btn-primary{ padding:10px 18px; border-radius:10px; border:none; cursor:pointer; font-family:inherit; font-weight:700; color:#fff; background:linear-gradient(135deg,#7c6cff,#5b4ce0); }
.typegrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:6px; }
.typeopt{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px; border-radius:12px; cursor:pointer; background:var(--bg); border:1px solid var(--line); font-size:11px; color:var(--muted); }
.typeopt.sel{ border-color:var(--purple); color:var(--text); }
.typeopt .tic{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; }

/* ===== Images modal ===== */
.imgmodal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
.imgmodal-head h3{ margin:0; font-size:20px; font-weight:800; }
.rx{ width:34px; height:34px; border-radius:50%; background:#2a2f3a; border:1px solid var(--line-2); color:#fff; cursor:pointer; font-size:14px; }
.imgsec{ margin-top:16px; }
.imgcard{ background:#1e2632; border:1px solid var(--line); border-radius:14px; padding:16px; }
.imgcard-h{ display:flex; align-items:center; justify-content:space-between; min-height:24px; margin-bottom:14px; }
.imgcard-t{ font-size:14.5px; font-weight:700; }
.imgprev{ background-size:cover; background-position:center; border:1px solid var(--line-2); }
.imgprev.round{ width:40px; height:40px; border-radius:50%; }
.imgprev.rect{ width:58px; height:34px; border-radius:8px; }
.imgupload{ width:100%; height:48px; border-radius:11px; cursor:pointer; border:none; background:#3a414c; color:#fff; font-family:inherit; font-size:14.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:9px; }
.imgupload:hover{ background:#454d59; }
.imgupload:active{ transform:scale(.99); }
.imgbtns{ display:flex; gap:11px; }
.imgbtn{ flex:1; height:46px; border-radius:11px; cursor:pointer; font-family:inherit; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; border:none; color:#fff; }
.imgbtn.edit{ background:#3a414c; } .imgbtn.edit:hover{ background:#454d59; }
.imgbtn.remove{ background:#262c37; } .imgbtn.remove:hover{ background:#2f3744; }
.imgbtn svg{ width:15px; height:15px; }

/* ===== cropper (full screen) ===== */
.cropper{ position:fixed; inset:0; z-index:95; background:#0b0d11; display:none; flex-direction:column; }
.cropper.show{ display:flex; }
.crop-x{ position:absolute; top:16px; left:16px; z-index:4; width:40px; height:40px; border-radius:50%;
  background:#1c222e; border:1px solid var(--line-2); color:#fff; cursor:pointer; display:grid; place-items:center; }
.crop-view{ flex:1; position:relative; overflow:hidden; touch-action:none; cursor:grab; }
.crop-view:active{ cursor:grabbing; }
#cropImg{ position:absolute; top:0; left:0; user-select:none; -webkit-user-drag:none; pointer-events:none; }
.crop-mask{ position:absolute; pointer-events:none; box-shadow:0 0 0 9999px rgba(0,0,0,.55); border:2px solid rgba(255,255,255,.9); }
.crop-bottom{ padding:18px 22px calc(20px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:18px; background:#0b0d11; }
#cropZoom{ -webkit-appearance:none; appearance:none; width:100%; height:5px; border-radius:5px; background:#39414f; outline:none; }
#cropZoom::-webkit-slider-thumb{ -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#fff; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.5); }
#cropZoom::-moz-range-thumb{ width:22px; height:22px; border:none; border-radius:50%; background:#fff; cursor:pointer; }
.crop-actions{ display:flex; gap:13px; }
.crop-change{ flex:1; height:52px; border-radius:13px; background:#1c222e; border:1px solid var(--line-2); color:#fff; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; }
.crop-save{ flex:1; height:52px; border-radius:13px; background:#3d4350; border:none; color:#fff; font-family:inherit; font-size:15px; font-weight:700; cursor:pointer; }
.crop-change:active,.crop-save:active{ transform:translateY(1px); }

/* ===== full-screen Add Content panel + form ===== */
.fs{ position:fixed; inset:0; z-index:92; background:var(--bg); display:none; justify-content:center; }
.fs.show{ display:flex; }
.fs.form{ z-index:94; }
.fs-col{ width:100%; max-width:500px; height:100dvh; display:flex; flex-direction:column; }
.fs-head{ flex:0 0 auto; position:relative; height:58px; display:flex; align-items:center; justify-content:center; background:var(--head); border-bottom:1px solid var(--line); }
.fs-head .back{ position:absolute; left:16px; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:#2a3140; border:1px solid var(--line-2); color:var(--text); cursor:pointer; }
.fs-head .back:active{ transform:scale(.93); }
.fs-head h2{ margin:0; font-size:18px; font-weight:800; }
.fs-search{ flex:0 0 auto; padding:14px 18px 4px; }
.fs-search .box{ display:flex; align-items:center; gap:9px; background:#222a36; border:1px solid var(--line); border-radius:12px; padding:11px 13px; }
.fs-search .box svg{ color:var(--muted); flex:0 0 auto; }
.fs-search input{ flex:1; min-width:0; border:none; background:none; outline:none; color:var(--text); font-family:inherit; font-size:14.5px; }
.fs-body{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 18px 36px; }
.cat-label{ font-size:12px; font-weight:800; letter-spacing:.12em; color:var(--label); text-transform:uppercase; margin:18px 4px 11px; }
.opt{ display:flex; align-items:center; gap:13px; padding:11px 14px; background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:11px; }
.opt .oic{ width:38px; height:38px; flex:0 0 38px; border-radius:50%; display:grid; place-items:center; background:#39414f; overflow:hidden; }
.opt .oname{ flex:1; min-width:0; font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:9px; }
.opt .cnt{ font-size:11px; font-weight:700; color:var(--muted); background:#2a3140; border-radius:999px; padding:2px 8px; }
.opt .addbtn2{ display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--text); font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; flex:0 0 auto; }
.opt .addbtn2 svg{ width:15px; height:15px; }
.opt .addbtn2:active{ transform:scale(.95); }
.no-res{ text-align:center; color:var(--muted); padding:48px 0; font-size:14px; }
.showmore{ display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--text); font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer; margin:0 4px 18px; padding:4px 2px; }
.showmore svg{ width:15px; height:15px; transition:transform .2s; }
.showmore.open svg{ transform:rotate(180deg); }
.showmore:active{ opacity:.7; }

/* phone input with country selector */
.phonebox{ display:flex; gap:10px; }
.cc{ display:flex; align-items:center; gap:7px; flex:0 0 auto; cursor:pointer; padding:0 11px; border-radius:11px;
  background:var(--bg); border:1px solid var(--line-2); color:var(--text); font-family:inherit; font-size:14px; font-weight:700; }
.cc:active{ transform:scale(.97); }
.cc .flag{ width:22px; height:16px; border-radius:2px; object-fit:cover; background:#2a3140; }
.cc svg{ width:14px; height:14px; color:var(--muted); }
.phonenum{ flex:1; min-width:0; font-family:inherit; font-size:14.5px; color:var(--text); background:var(--bg);
  border:1px solid var(--line-2); border-radius:11px; padding:13px 14px; outline:none; }
.phonenum:focus{ border-color:var(--purple); box-shadow:0 0 0 3px rgba(124,108,255,.16); }

/* country picker panel */
.fs.country{ z-index:96; }
.crow{ display:flex; align-items:center; gap:13px; width:100%; padding:13px 6px; background:none; border:none;
  border-bottom:1px solid var(--line); cursor:pointer; color:var(--text); font-family:inherit; text-align:left; }
.crow:hover{ background:var(--card); }
.crow.sel{ background:#222a36; border-radius:10px; }
.crow .flag{ width:24px; height:18px; border-radius:3px; object-fit:cover; flex:0 0 auto; background:#2a3140; }
.crow .cn{ flex:1; min-width:0; font-size:14.5px; font-weight:700; }
.crow .cd{ color:var(--muted); font-size:13.5px; font-weight:700; flex:0 0 auto; }
.cdiv{ height:10px; border-bottom:1px solid var(--line-2); margin-bottom:6px; }

.formcard{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
.formcard-h{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.formcard-h .l{ display:flex; align-items:center; gap:11px; font-size:15px; font-weight:700; }
.formcard-h .oic{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:#39414f; overflow:hidden; }
.formcard-h .info{ width:26px; height:26px; border-radius:50%; background:#2a3140; border:none; color:var(--muted); cursor:pointer; display:grid; place-items:center; }
.forminput{ width:100%; font-family:inherit; font-size:14.5px; color:var(--text); background:var(--bg); border:1px solid var(--line-2); border-radius:11px; padding:13px 14px; outline:none; }
.forminput:focus{ border-color:var(--purple); box-shadow:0 0 0 3px rgba(124,108,255,.16); }
.pastebtn{ width:100%; height:48px; margin-top:12px; border-radius:11px; border:none; cursor:pointer; background:#2a3140; color:#fff; font-family:inherit; font-size:14.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:9px; }
.pastebtn:hover{ background:#323a47; }
.testbtn{ width:100%; height:52px; margin-top:12px; border-radius:11px; border:none; cursor:pointer; background:#3d4350; color:#fff; font-family:inherit; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:9px; }
.testbtn:hover{ background:#474e5c; }
.addtitle{ width:100%; height:50px; margin-top:14px; border-radius:13px; border:none; cursor:pointer; background:#222a36; color:#fff; font-family:inherit; font-size:14.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; }
.removebtn{ width:100%; height:48px; margin-top:14px; border-radius:12px; border:1px solid rgba(240,85,106,.3); background:rgba(240,85,106,.1); color:var(--danger); font-family:inherit; font-weight:700; cursor:pointer; }
.fs-foot{ flex:0 0 auto; padding:14px 18px calc(16px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line); }
.submitbtn{ width:100%; height:54px; border-radius:14px; border:none; cursor:pointer; background:#3d4350; color:#fff; font-family:inherit; font-size:15.5px; font-weight:700; }
.submitbtn:hover:not(:disabled){ background:#474e5c; }
.submitbtn:disabled{ opacity:.45; cursor:not-allowed; }

.toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(16px); background:#fff; color:#11151c;
  font-weight:700; font-size:13.5px; padding:11px 18px; border-radius:999px; box-shadow:0 12px 30px rgba(0,0,0,.4);
  opacity:0; pointer-events:none; transition:.26s; z-index:90; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

</head>

<body>
  <div class="app">

    <!-- sticky header -->
    <header class="topbar">
      <a class="back" href="dashboard.html" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      </a>
      <h1>Setup</h1>
    </header>

    <div class="body">

      <!-- banner + avatar -->
      <div class="banner">
        <div class="grad"></div>
        <div class="banner-img" id="bannerImg"></div>
        <div class="avatar" id="avatar" title="Profile image" onclick="openImages()">
          <div class="ph" id="avatarPh">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.7-9 6v2h18v-2c0-3.3-4-6-9-6z"/></svg>
          </div>
        </div>
        <button class="upload" id="uploadBtn" onclick="openImages()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v13"/></svg>
          Upload
        </button>
      </div>
      <input type="file" id="imgInput" accept="image/*" hidden />

      <!-- BIO -->
      <div class="sec-row">
        <span class="sec-label">Bio</span>
        <button class="pillbtn" onclick="openBio()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
          Edit
        </button>
      </div>
      <div class="card bio" id="bioCard"><!-- rendered --></div>

      <!-- PROFILE CONTENT -->
      <span class="sec-label">Profile content</span>
      <div class="content-list" id="contentList"><!-- rendered --></div>
      <button class="addbtn" onclick="openAddPanel()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add Content
      </button>

      <!-- STYLE -->
      <span class="sec-label">Style</span>
      <div class="card stylecard">
        <div class="hd">
          <span class="name">Color</span>
          <span class="badge"><span class="dot" id="colorDot"></span><span id="colorName">Black</span></span>
        </div>
        <div class="swatches" id="swatches"></div>
        <button class="upgrade" onclick="toast('Upgrade — unlimited colors')">
          <span class="spark"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 4.8L19 8l-4.2 2.2L12 15l-2.8-4.8L5 8l5.2-1.2L12 2z"/></svg></span>
          Upgrade for Unlimited Colors
        </button>

        <div class="divline"></div>
        <div class="style-h">Theme</div>
        <div class="themeseg" id="themeSeg">
          <button class="bright" data-theme="bright" onclick="setTheme(this)"><span class="radio"></span>Bright</button>
          <button class="dim"    data-theme="dim"    onclick="setTheme(this)"><span class="radio"></span>Dim</button>
          <button class="dark"   data-theme="dark"   onclick="setTheme(this)"><span class="radio"></span>Dark</button>
        </div>

        <div class="divline"></div>
        <div class="style-h">Icon Style</div>
        <div class="iconstyles" id="iconStyles"></div>
      </div>

      <!-- preview -->
      <button class="preview" onclick="previewProfile()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        Preview Profile
      </button>
    </div>
  </div>

  <!-- ===== BIO modal ===== -->
  <div class="overlay" id="bioModal" onclick="if(event.target===this)close_('bioModal')">
    <div class="modal">
      <button class="x" onclick="close_('bioModal')">✕</button>
      <h3>Edit bio</h3>
      <label class="mlabel">Full Name</label><input class="minput" id="b-fullName" />
      <label class="mlabel">Headline</label><input class="minput" id="b-headline" />
      <label class="mlabel">Job Title</label><input class="minput" id="b-jobTitle" />
      <label class="mlabel">Company</label><input class="minput" id="b-company" />
      <label class="mlabel">Location</label><input class="minput" id="b-location" />
      <label class="mlabel">Education</label><input class="minput" id="b-education" />
      <label class="mlabel">Skills (comma separated)</label><input class="minput" id="b-skills" placeholder="Business, nfc card" />
      <div class="mactions"><div class="btn-row"><button class="btn-ghost" onclick="close_('bioModal')">Cancel</button><button class="btn-primary" onclick="saveBio()">Save</button></div></div>
    </div>
  </div>

  <!-- ===== Add Content panel (categorized list + search) ===== -->
  <div class="fs" id="addPanel">
    <div class="fs-col">
      <div class="fs-head">
        <button class="back" onclick="closeAddPanel()" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
        <h2>Add Content</h2>
      </div>
      <div class="fs-search">
        <div class="box">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="addSearch" placeholder="Search content types" autocomplete="off" oninput="renderAddPanel()" />
        </div>
      </div>
      <div class="fs-body" id="addBody"></div>
    </div>
  </div>

  <!-- ===== Add / Edit a content item ===== -->
  <div class="fs form" id="addForm">
    <div class="fs-col">
      <div class="fs-head">
        <button class="back" onclick="backToPanel()" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
        <h2 id="formTitle">Add</h2>
      </div>
      <div class="fs-body">
        <div class="formcard">
          <div class="formcard-h">
            <span class="l"><span class="oic" id="formIcon"></span><span id="formLabel">Email</span></span>
            <button class="info" onclick="toast('Enter the value, then tap Test to check it')" aria-label="Info">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg>
            </button>
          </div>
          <input class="forminput" id="formInput" autocomplete="off" oninput="onFormInput()" />
          <div class="phonebox" id="phoneBox" style="display:none">
            <button type="button" class="cc" id="ccBtn" onclick="openCountry()">
              <img class="flag" id="ccFlag" alt="" />
              <span id="ccCode">+998</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <input class="phonenum" id="phoneInput" inputmode="tel" autocomplete="off" placeholder="(123) 456-7890" oninput="onFormInput()" />
          </div>
          <button class="pastebtn" id="pasteTestBtn" onclick="pasteOrTest()"><span id="ptIcon"></span><span id="ptLabel">Paste</span></button>
        </div>
        <div id="titleWrap" style="display:none"><input class="forminput" id="formTitleInput" placeholder="Title (optional)" autocomplete="off" style="margin-top:14px" /></div>
        <button class="addtitle" id="addTitleBtn" onclick="toggleTitle()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Add Title
        </button>
        <button class="removebtn" id="removeBtn" style="display:none" onclick="deleteCurrent()">Remove</button>
      </div>
      <div class="fs-foot"><button class="submitbtn" id="submitBtn" onclick="submitAdd()" disabled>Add</button></div>
    </div>
  </div>

  <!-- ===== Select Country (phone) ===== -->
  <div class="fs country" id="countryPanel">
    <div class="fs-col">
      <div class="fs-head">
        <button class="back" onclick="closeCountry()" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
        <h2>Select Country</h2>
      </div>
      <div class="fs-search">
        <div class="box">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="countrySearch" placeholder="Search for country code" autocomplete="off" oninput="renderCountry()" />
        </div>
      </div>
      <div class="fs-body" id="countryBody"></div>
    </div>
  </div>


  <!-- ===== Images modal (Profile Image + Banner Image) ===== -->
  <div class="overlay" id="imagesModal" onclick="if(event.target===this)close_('imagesModal')">
    <div class="modal imgmodal">
      <div class="imgmodal-head">
        <h3>Images</h3>
        <button class="rx" onclick="close_('imagesModal')" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="imgsec" id="sec-avatar"></div>
      <div class="imgsec" id="sec-banner"></div>
    </div>
  </div>

  <!-- ===== crop / edit modal ===== -->
  <div class="cropper" id="cropper">
    <button class="crop-x" onclick="closeCropper()" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="crop-view" id="cropView">
      <img id="cropImg" alt="" draggable="false" />
      <div class="crop-mask" id="cropMask"></div>
    </div>
    <div class="crop-bottom">
      <input type="range" id="cropZoom" min="1" max="3" step="0.01" value="1" aria-label="Zoom" />
      <div class="crop-actions">
        <button class="crop-change" onclick="cropperChange()">Change</button>
        <button class="crop-save" onclick="cropperSave()">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Saved</div>

/* --- cropper (pan + zoom, circular for avatar / rectangular for banner) --- */
const crop={};
function openCropper(target, src){
  crop.target=target; crop.shape = target==='avatar' ? 'circle' : 'rect'; crop.src=src;
  crop.zoom=1; crop.panX=0; crop.panY=0;
  const img=new Image();
  img.onload=()=>{ crop.natW=img.naturalWidth; crop.natH=img.naturalHeight;
    document.getElementById('cropImg').src=src; document.getElementById('cropZoom').value=1;
    document.getElementById('cropper').classList.add('show');
    requestAnimationFrame(layoutCrop);
  };
  img.src=src;
}
function closeCropper(){ document.getElementById('cropper').classList.remove('show'); }
function layoutCrop(){
  const r=document.getElementById('cropView').getBoundingClientRect();
  crop.VW=r.width; crop.VH=r.height;
  if(crop.shape==='circle'){ const d=Math.min(crop.VW,crop.VH)*0.74; crop.fW=d; crop.fH=d; }
  else { let w=crop.VW*0.86, h=w/2.6; if(h>crop.VH*0.82){ h=crop.VH*0.82; w=h*2.6; } crop.fW=w; crop.fH=h; }
  crop.base=Math.max(crop.fW/crop.natW, crop.fH/crop.natH);
  renderCrop();
}
function renderCrop(){
  const cs=crop.base*crop.zoom, dW=crop.natW*cs, dH=crop.natH*cs;
  const maxX=Math.max(0,(dW-crop.fW)/2), maxY=Math.max(0,(dH-crop.fH)/2);
  crop.panX=Math.max(-maxX,Math.min(maxX,crop.panX));
  crop.panY=Math.max(-maxY,Math.min(maxY,crop.panY));
  const imgLeft=(crop.VW-dW)/2+crop.panX, imgTop=(crop.VH-dH)/2+crop.panY;
  const im=document.getElementById('cropImg');
  im.style.width=dW+'px'; im.style.height=dH+'px'; im.style.left=imgLeft+'px'; im.style.top=imgTop+'px';
  const fLeft=(crop.VW-crop.fW)/2, fTop=(crop.VH-crop.fH)/2;
  const m=document.getElementById('cropMask');
  m.style.width=crop.fW+'px'; m.style.height=crop.fH+'px'; m.style.left=fLeft+'px'; m.style.top=fTop+'px';
  m.style.borderRadius = crop.shape==='circle' ? '50%' : '14px';
}
document.getElementById('cropZoom').addEventListener('input', function(){ crop.zoom=parseFloat(this.value); renderCrop(); });
(function(){
  const v=document.getElementById('cropView'); let drag=false, lx=0, ly=0;
  v.addEventListener('pointerdown',e=>{ drag=true; lx=e.clientX; ly=e.clientY; try{v.setPointerCapture(e.pointerId);}catch(_){} });
  v.addEventListener('pointermove',e=>{ if(!drag) return; crop.panX+=e.clientX-lx; crop.panY+=e.clientY-ly; lx=e.clientX; ly=e.clientY; renderCrop(); });
  v.addEventListener('pointerup',()=>{ drag=false; });
  v.addEventListener('pointercancel',()=>{ drag=false; });
})();
window.addEventListener('resize',()=>{ if(document.getElementById('cropper').classList.contains('show')) layoutCrop(); });
function cropperChange(){ startUpload(crop.target); }   /* re-pick a different image */
function cropperSave(){
  const cs=crop.base*crop.zoom, dW=crop.natW*cs, dH=crop.natH*cs;
  const fLeft=(crop.VW-crop.fW)/2, fTop=(crop.VH-crop.fH)/2;
  const imgLeft=(crop.VW-dW)/2+crop.panX, imgTop=(crop.VH-dH)/2+crop.panY;
  const sx=(fLeft-imgLeft)/cs, sy=(fTop-imgTop)/cs, sw=crop.fW/cs, sh=crop.fH/cs;
  const outW = crop.shape==='circle' ? 512 : 1200;
  const outH = crop.shape==='circle' ? 512 : Math.round(outW*(crop.fH/crop.fW));
  const cv=document.createElement('canvas'); cv.width=outW; cv.height=outH;
  const ctx=cv.getContext('2d');
  const im=new Image();
  im.onload=()=>{
    ctx.drawImage(im, sx,sy,sw,sh, 0,0,outW,outH);
    P[crop.target]=cv.toDataURL('image/jpeg',0.92); save();
    if(crop.target==='avatar') paintAvatar(); else paintBanner();
    closeCropper(); renderImages(); toast('Saved');
  };
  im.src=crop.src;
}

/* ============================ BIO ============================ */
function renderBio(){
  const b=P.bio;
  const field=(k,v)=>`<div class="row"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`;
  const skills = (b.skills&&b.skills.length)
    ? `<div class="row"><div class="k">Skills</div><div class="chips">${b.skills.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div></div>`
    : `<div class="row"><div class="k">Skills</div><div class="v"></div></div>`;
  document.getElementById('bioCard').innerHTML =
    field('Full Name', b.fullName)+field('Headline', b.headline)+field('Job Title', b.jobTitle)+
    field('Company', b.company)+field('Location', b.location)+field('Education', b.education)+skills;
}
function openBio(){
  const b=P.bio;
  b_fullName.value=b.fullName; b_headline.value=b.headline; b_jobTitle.value=b.jobTitle;
  b_company.value=b.company; b_location.value=b.location; b_education.value=b.education;
  b_skills.value=(b.skills||[]).join(', ');
  open_('bioModal');
}
function saveBio(){
  P.bio={ fullName:b_fullName.value.trim(), headline:b_headline.value.trim(), jobTitle:b_jobTitle.value.trim(),
    company:b_company.value.trim(), location:b_location.value.trim(), education:b_education.value.trim(),
    skills:b_skills.value.split(',').map(s=>s.trim()).filter(Boolean) };
  save(); renderBio(); close_('bioModal'); toast('Bio saved');
}


/* ============================ Profile content ============================ */
/* glyph (svg) or a letter monogram, optionally dark for light icon styles */
function innerGlyph(key, dark){
  const it=CAT[key]||{};
  if(it.g && GLYPH[it.g]){
    let g=`<svg width="20" height="20" viewBox="0 0 24 24">${GLYPH[it.g]}</svg>`;
    if(dark) g=g.replace(/#fff/g,'#15181f').replace(/stroke="#fff"/g,'stroke="#15181f"');
    return g;
  }
  const ltr=((it.label||'?').trim()[0]||'?').toUpperCase();
  return `<span style="font-weight:700;font-size:15px;color:${dark?'#15181f':'#fff'}">${esc(ltr)}</span>`;
}
function iconCircle(key, style){
  let bg=BRAND[key]||'#39414f', dark=false;
  if(style==='light'){ bg='#e9edf3'; dark=true; }
  else if(style==='white'){ bg='#ffffff'; dark=true; }
  else if(style==='black'){ bg='#15181f'; dark=false; }
  return `<span style="width:100%;height:100%;display:grid;place-items:center;background:${bg}">${innerGlyph(key,dark)}</span>`;
}
function renderContent(){
  const list=document.getElementById('contentList');
  list.innerHTML = P.content.map((c,i)=>{
    const it=CAT[c.type]||{label:c.type};
    const sub = it.kind==='divider' ? '—' : (c.value||'');
    return `<div class="citem" draggable="true" data-i="${i}">
      <span class="handle" title="Drag"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
      <span class="cic">${iconCircle(c.type, P.iconStyle)}</span>
      <span class="grow"><div class="ct">${esc(c.title||it.label)}</div><div class="cs">${esc(sub)}</div></span>
      <button class="edit" onclick="editContent('${c.id}')" aria-label="Edit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg></button>
    </div>`;
  }).join('');
  enableDrag();
}

/* ---- Add Content panel ---- */
function show(id){ document.getElementById(id).classList.add('show'); }
function hide(id){ document.getElementById(id).classList.remove('show'); }
function openAddPanel(){ document.getElementById('addSearch').value=''; renderAddPanel(); show('addPanel'); }
function closeAddPanel(){ hide('addPanel'); }
function rowHTML(key){
  const it=CAT[key]; const n=P.content.filter(c=>c.type===key).length;
  return `<div class="opt">
    <span class="oic">${innerGlyph(key,false)}</span>
    <span class="oname">${esc(it.label)}${n?`<span class="cnt">${n}</span>`:''}</span>
    <button class="addbtn2" onclick="openAddForm('${key}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Add</button>
  </div>`;
}
/* each category limits to 4 items with its own Show more / Show less */
const catOpen={};
function toggleCat(id){ catOpen[id]=!catOpen[id]; renderAddPanel(); }
function groupBlock(label, id, keys, q){
  if(!keys.length) return '';
  const open=!!catOpen[id];
  const limited = !q && keys.length>4 && !open;
  const visible = limited ? keys.slice(0,4) : keys;
  let h = `<div class="cat-label">${label}</div>` + visible.map(rowHTML).join('');
  if(!q && keys.length>4){
    h += `<button class="showmore${open?' open':''}" onclick="toggleCat('${id}')">${open?'Show less':'Show more'}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>`;
  }
  return h;
}
function renderAddPanel(){
  const q=(document.getElementById('addSearch').value||'').trim().toLowerCase();
  let html='', any=false;
  if(!q){ const r=groupBlock('Recommended Content','recommended',RECOMMENDED,q); if(r){ html+=r; any=true; } }
  GROUPS.forEach(([label,cat])=>{
    let keys=CATALOG.filter(x=>x.cat===cat).map(x=>x.key);
    if(q) keys=keys.filter(k=>CAT[k].label.toLowerCase().includes(q));
    const block=groupBlock(label,cat,keys,q);
    if(block){ html+=block; any=true; }
  });
  document.getElementById('addBody').innerHTML = any ? html : `<div class="no-res">No content types found</div>`;
}

/* ---- Add / Edit form ---- */
const ARROW_SVG='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>';
const PASTE_SVG='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>';
const form={key:null, editingId:null};
function isTel(){ const it=CAT[form.key]; return it && it.kind==='tel'; }
function rawVal(){ return (isTel()? document.getElementById('phoneInput').value : document.getElementById('formInput').value).trim(); }
function openAddForm(key, editingId){
  form.key=key; form.editingId=editingId||null;
  const it=CAT[key]; if(!it) return;
  const tel = it.kind==='tel', divider = it.kind==='divider';
  document.getElementById('formTitle').textContent=(form.editingId?'Edit ':'Add ')+(tel?'Phone Number':it.label);
  document.getElementById('formLabel').textContent = tel?'Call':it.label;
  document.getElementById('formIcon').innerHTML=innerGlyph(key,false);
  const inp=document.getElementById('formInput'), btn=document.getElementById('pasteTestBtn'), pbox=document.getElementById('phoneBox');
  inp.style.display  = (tel||divider) ? 'none' : '';
  pbox.style.display = tel ? 'flex' : 'none';
  btn.style.display  = divider ? 'none' : '';
  if(!tel && !divider) inp.placeholder=it.ph||'';
  let v='', t='';
  if(form.editingId){ const c=P.content.find(x=>x.id===form.editingId); if(c){ v=c.value||''; t=c.title||'';
    if(tel){ setCC(c.cc||'uz'); document.getElementById('phoneInput').value=c.national||''; } } }
  if(tel && !form.editingId){ setCC('uz'); document.getElementById('phoneInput').value=''; }
  inp.value = tel ? '' : v;
  document.getElementById('formTitleInput').value=t;
  document.getElementById('titleWrap').style.display = t?'block':'none';
  document.getElementById('addTitleBtn').style.display = t?'none':'';
  document.getElementById('removeBtn').style.display = form.editingId?'block':'none';
  document.getElementById('submitBtn').textContent = form.editingId?'Save':'Add';
  onFormInput();
  show('addForm');
  if(!divider) setTimeout(()=>{ (tel?document.getElementById('phoneInput'):inp).focus(); },60);
}

/* country picker */
function setCC(iso){ currentCC = C_BY_ISO[iso]||C_BY_ISO['uz']; paintCC(); }
function paintCC(){ document.getElementById('ccFlag').src='https://flagcdn.com/24x18/'+currentCC.c+'.png'; document.getElementById('ccCode').textContent=currentCC.d; }
function openCountry(){ document.getElementById('countrySearch').value=''; renderCountry(); show('countryPanel'); }
function closeCountry(){ hide('countryPanel'); }
function countryRow(ct){
  return `<button class="crow${ct.c===currentCC.c?' sel':''}" onclick="pickCountry('${ct.c}')">
    <img class="flag" src="https://flagcdn.com/24x18/${ct.c}.png" alt="" loading="lazy" onerror="this.style.visibility='hidden'"/>
    <span class="cn">${esc(ct.n)}</span><span class="cd">${ct.d}</span></button>`;
}
function renderCountry(){
  const q=(document.getElementById('countrySearch').value||'').trim().toLowerCase();
  let html='';
  if(!q){
    html += PINNED.map(iso=>countryRow(C_BY_ISO[iso])).join('') + `<div class="cdiv"></div>`;
    html += COUNTRIES.map(countryRow).join('');
  } else {
    const qd=q.replace(/[^\d]/g,'');
    const m=COUNTRIES.filter(c=> c.n.toLowerCase().includes(q) || (qd && c.d.replace('+','').startsWith(qd)));
    html = m.length ? m.map(countryRow).join('') : `<div class="no-res">No countries found</div>`;
  }
  document.getElementById('countryBody').innerHTML=html;
}
function pickCountry(iso){ setCC(iso); closeCountry(); onFormInput(); }
function backToPanel(){ hide('addForm'); }
function closeAll(){ hide('addForm'); hide('addPanel'); }
function editContent(id){ const c=P.content.find(x=>x.id===id); if(c) openAddForm(c.type, id); }
function toggleTitle(){ document.getElementById('titleWrap').style.display='block'; document.getElementById('addTitleBtn').style.display='none'; document.getElementById('formTitleInput').focus(); }
function onFormInput(){
  const it=CAT[form.key]; const v=rawVal();
  const btn=document.getElementById('pasteTestBtn');
  if(it.kind==='divider'){ document.getElementById('submitBtn').disabled=false; return; }
  if(v){ btn.className='testbtn'; document.getElementById('ptLabel').textContent='Test'; document.getElementById('ptIcon').innerHTML=ARROW_SVG; }
  else { btn.className='pastebtn'; document.getElementById('ptLabel').textContent='Paste'; document.getElementById('ptIcon').innerHTML=PASTE_SVG; }
  document.getElementById('submitBtn').disabled = !validValue(form.key, v);
}
function validValue(key,v){
  const it=CAT[key]||{}; if(it.kind==='divider') return true; if(!v) return false;
  if(it.kind==='email') return /\S+@\S+\.\S+/.test(v);
  if(it.kind==='tel'||it.kind==='wa') return v.replace(/[^\d]/g,'').length>=4;
  return true;
}
function resolve(key,v){
  const it=CAT[key]||{}; v=(v||'').trim(); if(!v) return '';
  if(key==='address') return 'https://maps.google.com/?q='+encodeURIComponent(v);
  switch(it.kind){
    case 'email': return 'mailto:'+v;
    case 'tel':   return 'tel:'+v.replace(/[^\d+]/g,'');
    case 'wa':    return 'https://wa.me/'+v.replace(/[^\d]/g,'');
    case 'text':  return /^https?:\/\//i.test(v)?v:'';
    case 'user':  return /^https?:\/\//i.test(v)?v:(it.pre||'')+v.replace(/^@/,'');
    case 'url':
    default:      return /^https?:\/\//i.test(v)?v:'https://'+v;
  }
}
function pasteOrTest(){
  const v=rawVal();
  if(v){
    const href = isTel() ? 'tel:'+(currentCC.d+v).replace(/[^\d+]/g,'') : resolve(form.key,v);
    if(href){ if(href.startsWith('mailto:')||href.startsWith('tel:')) location.href=href; else window.open(href,'_blank','noopener'); }
    else toast('Nothing to open for this value');
  } else {
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(t=>{ const val=(t||'').trim();
        if(isTel()) document.getElementById('phoneInput').value=val; else document.getElementById('formInput').value=val;
        onFormInput();
      }).catch(()=>toast('Clipboard not available'));
    } else toast('Clipboard not available');
  }
}
function submitAdd(){
  const it=CAT[form.key]; const t=document.getElementById('formTitleInput').value.trim();
  if(it.kind!=='divider' && !validValue(form.key, rawVal())) return;
  let item;
  if(isTel()){ const nat=rawVal(); item={type:form.key, value:currentCC.d+' '+nat, title:t, cc:currentCC.c, national:nat}; }
  else if(it.kind==='divider'){ item={type:form.key, value:'', title:t}; }
  else { item={type:form.key, value:rawVal(), title:t}; }
  if(form.editingId){ const c=P.content.find(x=>x.id===form.editingId); if(c) Object.assign(c, item); toast('Saved'); }
  else { item.id='c'+Date.now(); P.content.push(item); toast('Added'); }
  save(); renderContent(); closeAll();
}
function deleteCurrent(){ if(form.editingId){ P.content=P.content.filter(x=>x.id!==form.editingId); save(); renderContent(); } closeAll(); toast('Removed'); }

/* drag reorder */
let dragI=null;
function enableDrag(){
  document.querySelectorAll('.citem').forEach(el=>{
    el.addEventListener('dragstart',()=>{ dragI=+el.dataset.i; el.classList.add('drag'); });
    el.addEventListener('dragend',()=>{ el.classList.remove('drag'); dragI=null; });
    el.addEventListener('dragover',e=>{ e.preventDefault(); });
    el.addEventListener('drop',e=>{ e.preventDefault(); const to=+el.dataset.i; if(dragI==null||dragI===to) return;
      const m=P.content.splice(dragI,1)[0]; P.content.splice(to,0,m); save(); renderContent(); });
  });
}


/* ============================ Style: color / theme / icon ============================ */
function renderSwatches(){
  document.getElementById('swatches').innerHTML = COLORS.map(c=>
    `<button class="swatch${c.key===P.color?' sel':''}" style="background:${c.hex}" onclick="setColor('${c.key}')" aria-label="${c.key}"></button>`).join('');
  const cur=COLORS.find(c=>c.key===P.color)||COLORS[6];
  document.getElementById('colorDot').style.background=cur.hex;
  document.getElementById('colorName').textContent=cur.key.charAt(0).toUpperCase()+cur.key.slice(1);
}
function setColor(k){ P.color=k; save(); renderSwatches(); }
function paintTheme(){ document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('sel', b.dataset.theme===P.theme)); }
function setTheme(b){ P.theme=b.dataset.theme; save(); paintTheme(); }
function renderIconStyles(){
  const wrap=document.getElementById('iconStyles');
  let html = ICON_STYLES.map(st=>
    `<button class="istyle${st===P.iconStyle?' sel':''}" onclick="setIconStyle('${st}')" title="${st}">${iconCircle('instagram',st)}</button>`).join('');
  html += `<span class="isep"></span>`;
  // locked premium variants (visual only)
  ['gradient','light','white','black'].forEach(st=>{ html += `<button class="istyle lock" title="Premium">${iconCircle('instagram',st)}</button>`; });
  wrap.innerHTML=html;
}
function setIconStyle(st){ P.iconStyle=st; save(); renderIconStyles(); renderContent(); }

/* ============================ Preview ============================ */
function previewProfile(){ save(); toast('Opening preview…'); setTimeout(()=> location.href='profile.html', 450); }

/* ============================ modal helpers ============================ */
function open_(id){ document.getElementById(id).classList.add('show'); }
function close_(id){ document.getElementById(id).classList.remove('show'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.querySelectorAll('.overlay.show').forEach(o=>o.classList.remove('show')); });
let tt; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1500); }

/* shorthand id refs used above */
const b_fullName=document.getElementById('b-fullName'), b_headline=document.getElementById('b-headline'),
  b_jobTitle=document.getElementById('b-jobTitle'), b_company=document.getElementById('b-company'),
  b_location=document.getElementById('b-location'), b_education=document.getElementById('b-education'),
  b_skills=document.getElementById('b-skills');

/* ============================ init ============================ */
function init(){
  paintBanner(); paintAvatar(); renderBio(); renderContent(); renderSwatches(); paintTheme(); renderIconStyles();
  /* arrived from the profile's edit mode wanting to edit one item? open it. */
  try{ const eid=localStorage.getItem('dot_edit_item'); if(eid){ localStorage.removeItem('dot_edit_item'); const c=P.content.find(x=>x.id===eid); if(c) setTimeout(()=>openAddForm(c.type, eid), 80); } }catch(_){}
}
init();
</script>
