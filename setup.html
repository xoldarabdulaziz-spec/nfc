<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Set up your profile · dot.</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
/* =========================================================================
   SETUP / ONBOARDING  ·  dot.cards-style (light theme)
   --------------------------------------------------------------------------
   Flow:  login.html  ->  setup.html  ->  dashboard.html
   • Add photo + banner, name, bio
   • Claim a dot.URL (subdomain) with live red/green availability check
   • Optional social links
   • "Create" saves the profile + a new site card, then opens the dashboard
   Same .card.com suffix + uniqueness rules as the dashboard.
   ========================================================================= */

:root{
  --ink:#1b1b1f; --muted:#8a8f98; --faint:#aeb3bb;
  --teal:#36b3c4; --green:#18a957; --danger:#e0413f;
  --line:#e6e7ea; --field:#fbfbfc; --btn:#2e2e30; --radius:14px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; }
body{
  font-family:'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color:var(--ink); background:#fff; display:flex; justify-content:center;
}
body::before{ content:""; position:fixed; top:0; left:0; right:0; height:3px; z-index:10;
  background:linear-gradient(90deg,#ffd9b0,#ffb27a,#ff8f6b); }

.page{ width:100%; max-width:480px; min-height:100dvh; display:flex; flex-direction:column;
  border-left:1px solid var(--line); border-right:1px solid var(--line); }

/* header */
.brandbar{ height:54px; display:flex; align-items:center; justify-content:space-between;
  padding:0 18px; border-bottom:1px solid var(--line); }
.brandbar .dot{ font-weight:700; font-size:19px; }
.skip{ font-size:13px; font-weight:600; color:var(--muted); text-decoration:none; }
.skip:hover{ color:var(--ink); }

.content{ flex:1; display:flex; flex-direction:column; padding:20px 22px 26px; }
.title{ font-size:23px; font-weight:700; margin:6px 0 4px; }
.subtitle{ font-size:14px; color:var(--muted); margin:0 0 20px; }

/* cover + avatar */
.cover{ position:relative; height:120px; border-radius:16px; overflow:visible; margin-bottom:60px;
  background:linear-gradient(135deg,#e9ecf3,#dfe3ec); border:1px solid var(--line); }
.cover .cover-img{ position:absolute; inset:0; border-radius:16px; background-size:cover; background-position:center; }
.cover .cam{ position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:9px;
  display:grid; place-items:center; background:rgba(255,255,255,.85); border:none; cursor:pointer; color:#444; }
.avatar{ position:absolute; left:18px; bottom:-46px; width:92px; height:92px; border-radius:50%;
  background:#eef0f4 center/cover no-repeat; border:4px solid #fff; box-shadow:0 4px 14px rgba(0,0,0,.10);
  display:grid; place-items:center; cursor:pointer; color:var(--faint); }
.avatar .plus{ font-size:26px; font-weight:300; }
.avatar .cam-s{ position:absolute; right:0; bottom:2px; width:26px; height:26px; border-radius:50%;
  background:var(--btn); color:#fff; display:grid; place-items:center; border:2px solid #fff; }

/* fields */
.label{ display:block; font-size:13px; font-weight:600; margin:16px 0 7px; }
.input, .textarea{ width:100%; font-family:inherit; font-size:14.5px; color:var(--ink);
  background:var(--field); border:1px solid var(--line); border-radius:var(--radius); padding:12px 13px; outline:none; transition:.15s; }
.input::placeholder, .textarea::placeholder{ color:#b6bac1; }
.input:focus, .textarea:focus{ border-color:var(--teal); background:#fff; box-shadow:0 0 0 3px rgba(54,179,196,.12); }
.textarea{ resize:vertical; min-height:74px; }
.counter{ text-align:right; font-size:11.5px; color:var(--faint); margin-top:4px; }

/* dot.URL (subdomain) */
.url-row{ display:flex; align-items:stretch; background:var(--field); border:1px solid var(--line);
  border-radius:var(--radius); overflow:hidden; transition:.15s; }
.url-row:focus-within{ border-color:var(--teal); box-shadow:0 0 0 3px rgba(54,179,196,.12); }
.url-row .prefix{ display:flex; align-items:center; padding:0 4px 0 13px; color:var(--muted); font-size:14px; white-space:nowrap; }
.url-row input{ flex:1; min-width:0; border:none; background:none; outline:none; font-family:inherit; font-size:14.5px; color:var(--ink); padding:12px 6px; }
.url-row .suffix{ display:flex; align-items:center; padding:0 13px; background:#f0f1f4; border-left:1px solid var(--line); color:var(--muted); font-size:14px; white-space:nowrap; }
.url-row.valid{ border-color:var(--green); box-shadow:0 0 0 3px rgba(24,169,87,.12); }
.url-row.invalid{ border-color:var(--danger); box-shadow:0 0 0 3px rgba(224,65,63,.12); }

.hint{ display:none; align-items:center; gap:6px; font-size:12.5px; font-weight:600; margin-top:8px; line-height:1.45; }
.hint.show{ display:flex; }
.hint.ok{ color:var(--green); }
.hint.err{ color:var(--danger); }

/* socials */
.socials{ display:grid; gap:10px; margin-top:6px; }
.social{ display:flex; align-items:center; gap:10px; background:var(--field); border:1px solid var(--line); border-radius:var(--radius); padding:0 12px; transition:.15s; }
.social:focus-within{ border-color:var(--teal); box-shadow:0 0 0 3px rgba(54,179,196,.12); background:#fff; }
.social .ic{ width:24px; height:24px; flex:0 0 24px; display:grid; place-items:center; color:#fff; border-radius:7px; }
.social input{ flex:1; border:none; background:none; outline:none; font-family:inherit; font-size:14px; color:var(--ink); padding:11px 0; }

/* create button */
.create{ margin-top:24px; width:100%; height:54px; border:none; border-radius:14px; cursor:pointer;
  background:var(--btn); color:#fff; font-family:inherit; font-size:16px; font-weight:600;
  box-shadow:0 8px 20px rgba(46,46,48,.26); transition:.15s; }
.create:hover{ background:#1f1f21; }
.create:active{ transform:translateY(1px); }
.create:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none; }

.toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(16px);
  background:#1b1b1f; color:#fff; font-weight:600; font-size:13.5px; padding:11px 18px; border-radius:999px;
  opacity:0; pointer-events:none; transition:.26s; z-index:50; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

<body>
  <div class="page">

    <div class="brandbar">
      <span class="dot">dot<span style="color:var(--teal)">.</span></span>
      <a class="skip" href="dashboard.html">Skip for now</a>
    </div>

    <main class="content">
      <h1 class="title">Set up your profile</h1>
      <p class="subtitle">A few details and your dot. is ready to share.</p>

      <!-- cover + avatar (tap to upload) -->
      <div class="cover">
        <div class="cover-img" id="coverImg"></div>
        <button type="button" class="cam" title="Add banner" onclick="coverInput.click()">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <div class="avatar" id="avatar" title="Add photo" onclick="avatarInput.click()">
          <span class="plus" id="avatarPlus">+</span>
          <span class="cam-s"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
        </div>
      </div>
      <input type="file" id="avatarInput" accept="image/*" hidden />
      <input type="file" id="coverInput"  accept="image/*" hidden />

      <!-- name -->
      <label class="label" for="name">Full name</label>
      <input id="name" class="input" placeholder="e.g. Yuki Tanaka" autocomplete="name" oninput="validate()" />

      <!-- bio -->
      <label class="label" for="bio">Bio</label>
      <textarea id="bio" class="textarea" maxlength="140" placeholder="Manga artist & creative director" oninput="bioCount()"></textarea>
      <div class="counter"><span id="bioCount">0</span>/140</div>

      <!-- dot.URL -->
      <label class="label" for="sub">Your dot.URL</label>
      <div class="url-row" id="urlRow">
        <span class="prefix">@</span>
        <input id="sub" placeholder="yourname" autocomplete="off" spellcheck="false" oninput="onSubInput()" />
        <span class="suffix" id="suffix">.card.com</span>
      </div>
      <div class="hint err" id="hintErr">This URL has already been taken. You cannot create a site with this URL. Please choose a different subdomain.</div>
      <div class="hint ok"  id="hintOk">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span id="hintOkText">Available</span>
      </div>

      <!-- socials -->
      <label class="label">Social links <span style="color:var(--faint);font-weight:500">(optional)</span></label>
      <div class="socials">
        <div class="social"><span class="ic" style="background:linear-gradient(135deg,#fa7e1e,#d62976)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/></svg></span><input id="s-ig" placeholder="Instagram username" autocomplete="off" /></div>
        <div class="social"><span class="ic" style="background:#229ED9"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M21.5 3.5 2.8 10.7c-.9.4-.9 1.6 0 1.9l4.7 1.5 1.8 5.6c.3.8 1.3 1 1.9.3l2.5-2.6 4.8 3.5c.7.5 1.7.1 1.9-.7L23 4.8c.2-1-.7-1.8-1.5-1.3z"/></svg></span><input id="s-tg" placeholder="Telegram username" autocomplete="off" /></div>
        <div class="social"><span class="ic" style="background:#2ecc71"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></span><input id="s-phone" placeholder="Phone number" inputmode="tel" autocomplete="off" /></div>
        <div class="social"><span class="ic" style="background:#6c5ce7"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/></svg></span><input id="s-web" placeholder="Website URL" autocomplete="off" /></div>
      </div>

      <!-- create -->
      <button class="create" id="createBtn" onclick="createCard()" disabled>Create my dot. →</button>
    </main>
  </div>

  <div class="toast" id="toast">Done</div>

<script>
/* ===== shared with dashboard ===== */
const DOMAIN_SUFFIX = ".card.com";
const STORE_KEY = "dot_sites";
const GRADS = [
  "linear-gradient(135deg,#7c5cff,#ff5c8a)","linear-gradient(135deg,#3b82f6,#22d3ee)",
  "linear-gradient(135deg,#f59e0b,#ef4444)","linear-gradient(135deg,#22c55e,#0ea5a5)"
];

/* must be logged in */
if (localStorage.getItem('dot_logged_in') !== '1') location.replace('login.html');

function loadSites(){ try{ const r=localStorage.getItem(STORE_KEY); if(r) return JSON.parse(r); }catch(_){} return []; }
function sanitizeSub(v){ return String(v).trim().toLowerCase().replace(/[^a-z0-9-]/g,''); }
function isTaken(sub){
  const domain=(sub+DOMAIN_SUFFIX).toLowerCase();
  return loadSites().some(s => String(s.domain).toLowerCase() === domain);
}

let avatarData = "", coverData = "";

/* ----- image upload previews ----- */
function readImage(input, cb){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader(); r.onload = e => cb(e.target.result); r.readAsDataURL(f);
}
avatarInput.addEventListener('change', () => readImage(avatarInput, d => {
  avatarData = d;
  const a = document.getElementById('avatar');
  a.style.backgroundImage = `url(${d})`;
  document.getElementById('avatarPlus').style.display = 'none';
}));
coverInput.addEventListener('change', () => readImage(coverInput, d => {
  coverData = d; document.getElementById('coverImg').style.backgroundImage = `url(${d})`;
}));

/* ----- subdomain live validation (red taken / green available) ----- */
function onSubInput(){
  const sub = sanitizeSub(document.getElementById('sub').value);
  const row = document.getElementById('urlRow');
  const err = document.getElementById('hintErr');
  const ok  = document.getElementById('hintOk');

  if(!sub){ err.classList.remove('show'); ok.classList.remove('show'); row.classList.remove('valid','invalid'); }
  else if(isTaken(sub)){ ok.classList.remove('show'); row.classList.remove('valid'); err.classList.add('show'); row.classList.add('invalid'); }
  else {
    err.classList.remove('show'); row.classList.remove('invalid');
    document.getElementById('hintOkText').textContent = sub + DOMAIN_SUFFIX + ' is available';
    ok.classList.add('show'); row.classList.add('valid');
  }
  validate();
}

/* ----- enable Create only when name + valid, available subdomain ----- */
function validate(){
  const name = document.getElementById('name').value.trim();
  const sub  = sanitizeSub(document.getElementById('sub').value);
  const okSub = !!sub && !isTaken(sub);
  document.getElementById('createBtn').disabled = !(name && okSub);
}

function bioCount(){ document.getElementById('bioCount').textContent = document.getElementById('bio').value.length; }

/* ----- create: save profile + a new site card, go to dashboard ----- */
function createCard(){
  const name = document.getElementById('name').value.trim();
  const sub  = sanitizeSub(document.getElementById('sub').value);
  if(!name || !sub || isTaken(sub)){ onSubInput(); return; }

  const profile = {
    name, sub, domain: sub + DOMAIN_SUFFIX,
    bio: document.getElementById('bio').value.trim(),
    avatar: avatarData, cover: coverData,
    socials: {
      instagram: document.getElementById('s-ig').value.trim(),
      telegram:  document.getElementById('s-tg').value.trim(),
      phone:     document.getElementById('s-phone').value.trim(),
      website:   document.getElementById('s-web').value.trim()
    }
  };
  try{ localStorage.setItem('dot_profile', JSON.stringify(profile)); }catch(_){}

  // add a card to the dashboard list
  const sites = loadSites();
  sites.unshift({
    id:'s'+Date.now(), name, domain: sub + DOMAIN_SUFFIX, link:'card.html',
    grad: GRADS[Math.floor(Math.random()*GRADS.length)]
  });
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(sites)); }catch(_){}

  toast('Profile created ✓');
  setTimeout(()=> location.href = 'dashboard.html', 600);
}

let tt; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1600); }
</script>
</body>
</html>
